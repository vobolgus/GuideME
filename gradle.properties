org.gradle.parallel=true
org.gradle.warning.mode=all

java_version=25

# Pin the published version to the upstream tag this branch is based on.
# (Without this, the version is derived from the git branch name.)
version=26.1.10-alpha

#########################################################
# Minecraft Versions                                    #
#########################################################
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.1.2.10-beta
neoforge_version_range=[26.1.2.10-beta,26.2-)
# https://meta.fabricmc.net/v2/versions/loader
fabric_loader_version=0.19.3
# https://modrinth.com/mod/fabric-api/versions?g=26.1.2
fabric_api_version=0.151.0+26.1.2
# Compile the shared sources (src/main) in :fabric as well.
guideme.fabric.shared=true

#########################################################
# Third party dependencies
#########################################################
snakeyaml_version=1.33
directory_watcher_version=0.17.1
junit_version=5.13.4
flatbuffers_version=23.5.26
ffmpeg_version=6.0-1.5.9
assertj_version=3.26.0
lucene_version=10.3.2
